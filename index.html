<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>G10 Student System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
<script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

<style>
body{
    background:#f4f4f4;
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
}

header{
    background:#5e0e0e;
    color:white;
    text-align:center;
    padding:20px;
    margin-bottom:20px;
}

.tab-content{
    display:none;
}

.active{
    display:block;
}

.card-box{
    background:#e9f2ff;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
}
</style>
</head>

<body>

<header>
<h1><b>⤷.₊ ⊹⋮ G10 Student System .ᐟ ˎˊ˗</b></h1>
<p>Classmates • Attendance • Gallery</p>
</header>

<div class="container">

<!-- BUTTONS -->
<div class="mb-4">
<button class="btn btn-dark" onclick="showTab('tab1')">Classmates</button>
<button class="btn btn-dark" onclick="showTab('tab2')">Attendance</button>
<button class="btn btn-dark" onclick="showTab('tab3')">Gallery</button>
</div>

<!-- TAB 1 -->
<div id="tab1" class="tab-content active">

<h2>Classmates System</h2>

<input id="name" class="form-control mt-2" placeholder="Enter Name">
<input id="section" class="form-control mt-2" placeholder="Enter Section">
<input id="subject" class="form-control mt-2" placeholder="Favorite Subject">

<button py-click="add_classmate" class="btn btn-dark mt-3">
Add Classmate
</button>

<div id="output-list" class="mt-3"></div>

</div>

<!-- TAB 2 -->
<div id="tab2" class="tab-content">

<h2>Attendance Tracker</h2>

<select id="day" class="form-select mt-2">
<option>Mon</option>
<option>Tue</option>
<option>Wed</option>
<option>Thu</option>
<option>Fri</option>
</select>

<input id="absence" type="number" class="form-control mt-2" placeholder="Number of Absences">

<button py-click="add_attendance" class="btn btn-dark mt-3">
Submit
</button>

<div id="output-graph" class="mt-4"></div>

</div>

<!-- TAB 3 -->
<div id="tab3" class="tab-content">

<h2>Gallery</h2>

<div id="classpics" class="carousel slide mt-4" data-bs-ride="carousel">

<div class="carousel-inner">

<div class="carousel-item active">
<img src="classpics_intrams" class="d-block w-100">
<div class="carousel-caption d-none d-md-block">
<h5>intrams</h5>
</div>
</div>

<div class="carousel-item">
<img src="classpics_christmas" class="d-block w-100">
<div class="carousel-caption d-none d-md-block">
<h5>christmas party</h5>
</div>
</div>

<div class="carousel-item">
<img src="classpics_foodfair" class="d-block w-100">
<div class="carousel-caption d-none d-md-block">
<h5>food fair</h5>
</div>
</div>

<div class="carousel-item">
<img src="classpics_halloween" class="d-block w-100">
<div class="carousel-caption d-none d-md-block">
<h5>halloween</h5>
</div>
</div>

<div class="carousel-item">
<img src="classpics_campout" class="d-block w-100">
<div class="carousel-caption d-none d-md-block">
<h5>campout</h5>
</div>
</div>

</div>

<button class="carousel-control-prev" type="button" data-bs-target="#classpics" data-bs-slide="prev">
<span class="carousel-control-prev-icon"></span>
</button>

<button class="carousel-control-next" type="button" data-bs-target="#classpics" data-bs-slide="next">
<span class="carousel-control-next-icon"></span>
</button>

</div>

</div>

</div>

<script>
function showTab(tabId){
document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
document.getElementById(tabId).classList.add("active");
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<py-config>
packages = ["numpy","matplotlib"]
</py-config>

<py-script src="main.py"></py-script>

</body>
</html>
